name: build-and-deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: musanna-soft
  GITOPS_REPO: musanna-soft/k8s-gitops

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Image tag
        id: meta
        run: echo "tag=master-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push jprq image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/jprq:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout k8s-gitops
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Bump image tags
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -e
          IMG="ghcr.io/${{ env.OWNER }}/jprq"
          if [ -d apps/jprq ]; then
            grep -rl "$IMG:" apps/jprq | while read -r f; do
              sed -i -E "s#($IMG):[^\"[:space:]]+#\1:${TAG}#g" "$f"
            done
          fi

      - name: Commit & push
        run: |
          git config user.name "jprq-ci"
          git config user.email "ci@tulki.uz"
          git add -A
          git commit -m "deploy(jprq): image ${{ needs.build.outputs.tag }}" || echo "no changes"
          git push
